<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShooterFC</title>
    <style>
        body { margin: 0; overflow: hidden; background: #c3e3ff; font-family: 'Segoe UI', sans-serif; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 6px; height: 6px; border: 2px solid white; border-radius: 50%; transform: translate(-50%, -50%); z-index: 10; pointer-events: none; }
        
        /* FRONT MAIN MENU - REMOVED DARK OVERLAY BACKGROUND TO SHOW THE ATMOSPHERE */
        #menu-container { 
            position: absolute; inset: 0; 
            background: transparent; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            color: white; z-index: 2000; pointer-events: all; 
        }

        /* WEAPON AND SETTINGS OVERLAYS WITH GLASSMORPHIC BLUR DESIGN */
        #settings-container, #weapon-container { 
            position: absolute; inset: 0; 
            background: radial-gradient(circle, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0.9) 100%); 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            color: white; z-index: 2000; backdrop-filter: blur(10px); pointer-events: all; 
            display: none;
        }
        
        /* THE GLASS CARD CONFIGURATION */
        .menu-card { 
            background: rgba(255, 255, 255, 0.08); 
            padding: 40px; 
            border-radius: 28px; 
            border: 1px solid rgba(255,255,255,0.15); 
            text-align: center; 
            width: 340px;
            backdrop-filter: blur(14px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
        }

        .settings-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 16px 0;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .settings-select {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 6px 10px;
            border-radius: 6px;
            font-weight: bold;
            outline: none;
            cursor: pointer;
        }
        .settings-select option {
            background: #111;
            color: white;
        }
        
        .btn { 
            width: 100%; padding: 15px; margin: 12px 0; 
            background: white; color: black; border: none; 
            border-radius: 6px; font-weight: bold; cursor: pointer; 
            text-transform: uppercase; transition: 0.2s; 
            font-size: 14px; letter-spacing: 0.5px;
        }
        .btn:hover { background: #55aa44; color: white; transform: scale(1.03); }
        
        #fps-counter { position: absolute; bottom: 10px; right: 10px; color: #0f0; font-family: monospace; z-index: 5; }
        #kill-counter { position: absolute; top: 20px; right: 20px; color: white; font-size: 24px; font-weight: bold; z-index: 5; }
        #damage-flash { position: absolute; inset: 0; background: red; opacity: 0; pointer-events: none; z-index: 1500; }
        
        #health-container { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); width: 300px; height: 20px; background: rgba(0,0,0,0.5); border: 2px solid white; border-radius: 10px; overflow: hidden; z-index: 10; }
        #health-bar { width: 100%; height: 100%; background: #ff3333; transition: width 0.2s; }
        #health-text { position: absolute; width: 100%; text-align: center; color: white; font-weight: bold; font-size: 14px; line-height: 20px; }
    </style>
</head>
<body>
    <div id="damage-flash"></div>
    <div id="crosshair"></div>
    <div id="fps-counter">FPS: --</div>
    <div id="kill-counter">KILLS: 0</div>
    <div id="health-container">
        <div id="health-text">HEALTH: 100%</div>
        <div id="health-bar"></div>
    </div>

    <div id="menu-container">
        <div class="menu-card">
            <h1 style="color:#55aa44; font-size: 32px; letter-spacing: 1px; margin-top: 0; margin-bottom: 25px; font-weight: 800;">GRASSLAND</h1>
            <button class="btn" id="start-btn">Resume Game</button>
            <button class="btn" id="open-weapons">Loadout</button>
            <button class="btn" id="open-settings">Settings</button>
        </div>
    </div>

    <div id="weapon-container">
        <div class="menu-card">
            <h2>WEAPONS</h2>
            <button class="btn" id="select-rifle">Assault Rifle</button>
            <button class="btn" id="select-shotgun">Shotgun</button>
            <button class="btn" id="select-sniper">Sniper</button>
            <button class="btn" id="select-smg">SMG</button>
            <button class="btn" id="select-pistol">Pistol</button>
            <button class="btn" id="back-from-weapons">Back</button>
        </div>
    </div>

    <div id="settings-container">
        <div class="menu-card">
            <h2 style="margin-top: 0; margin-bottom: 20px; font-weight: 700;">SETTINGS</h2>
            
            <div class="settings-row">
                <span>MOTION BLUR:</span>
                <select id="blur-toggle" class="settings-select">
                    <option value="OFF">OFF</option>
                    <option value="ON">ON</option>
                </select>
            </div>

            <div class="settings-row">
                <span>FPS LIMIT:</span>
                <select id="fps-limit" class="settings-select">
                    <option value="UNLIMITED">UNLIMITED</option>
                    <option value="144">144 FPS</option>
                    <option value="120">120 FPS</option>
                    <option value="60">60 FPS</option>
                    <option value="30">30 FPS</option>
                </select>
            </div>

            <div class="settings-row">
                <span>RESOLUTION:</span>
                <select id="res-scale" class="settings-select">
                    <option value="1.0">100% (Native)</option>
                    <option value="2.0">200% (UHD Super Sampling)</option>
                    <option value="1.5">150% (High)</option>
                    <option value="0.75">75% (Balanced)</option>
                    <option value="0.5">50% (Performance)</option>
                </select>
            </div>

            <button class="btn" id="back-to-menu" style="margin-top: 25px;">Save & Exit</button>
        </div>
    </div>

    <script type="importmap"> { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } } </script>
    <script type="module" src="game-engine.js"></script>
</body>
</html>
