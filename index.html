<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UHD Grassland Simulator - Pro Edition</title>
    <style>
        body { margin: 0; overflow: hidden; background: #0a0f1d; font-family: 'Segoe UI', system-ui, sans-serif; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 6px; height: 6px; background: rgba(255,255,255,0.9); border-radius: 50%; transform: translate(-50%, -50%); z-index: 10; pointer-events: none; box-shadow: 0 0 4px rgba(0,0,0,0.8); }
        
        #menu-container, #settings-container, #weapon-container { 
            position: absolute; inset: 0; 
            background: radial-gradient(circle at center, rgba(10, 15, 30, 0.7) 0%, rgba(5, 7, 12, 0.98) 100%); 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            color: white; z-index: 2000; backdrop-filter: blur(15px); pointer-events: all; 
        }
        
        #settings-container, #weapon-container { display: none; }
        .menu-card { 
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.01) 100%); 
            padding: 40px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.08); 
            text-align: center; width: 360px; box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }
        
        h1 { letter-spacing: 3px; margin-bottom: 20px; font-weight: 800; font-size: 28px; color: #7cfc00; text-shadow: 0 0 15px rgba(124,252,0,0.3); }
        h2 { letter-spacing: 2px; margin-bottom: 20px; font-weight: 700; }
        
        .btn { 
            width: 100%; padding: 15px; margin: 10px 0; 
            background: linear-gradient(135deg, #ffffff 0%, #e0e0e0 100%); 
            color: #000; border: none; border-radius: 8px; 
            font-weight: 700; cursor: pointer; text-transform: uppercase; 
            transition: all 0.2s ease-in-out;
        }
        .btn:hover { 
            background: linear-gradient(135deg, #7cfc00 0%, #55aa44 100%); 
            color: white; transform: translateY(-2px); 
            box-shadow: 0 6px 20px rgba(85,170,68,0.4);
        }
        
        .setting-row { margin: 18px 0; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
        .setting-row select { padding: 6px 12px; background: #1a1a2e; color: white; border: 1px solid rgba(255,255,255,0.2); border-radius: 4px; outline: none; width: 140px; }
        
        #fps-counter { position: absolute; bottom: 15px; right: 20px; color: #7cfc00; font-family: monospace; font-size: 14px; font-weight: bold; z-index: 5; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
        #kill-counter { position: absolute; top: 25px; right: 30px; color: white; font-size: 24px; font-weight: 800; z-index: 5; text-shadow: 0 2px 8px rgba(0,0,0,0.6); }
        #damage-flash { position: absolute; inset: 0; background: radial-gradient(circle, rgba(255,0,0,0) 30%, rgba(200,0,0,0.5) 100%); opacity: 0; pointer-events: none; z-index: 1500; transition: opacity 0.1s; }
        
        #health-container { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); width: 300px; height: 12px; background: rgba(5,7,12,0.8); border: 1px solid rgba(255,255,255,0.15); border-radius: 6px; overflow: hidden; z-index: 10; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        #health-bar { width: 100%; height: 100%; background: linear-gradient(90deg, #ff3333 0%, #ff5555 100%); transition: width 0.2s ease-out; }
        #health-text { position: absolute; width: 100%; text-align: center; color: white; font-weight: 700; font-size: 11px; letter-spacing: 1px; line-height: 12px; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
    </style>
</head>
<body>
    <div id="damage-flash"></div>
    <div id="crosshair"></div>
    <div id="fps-counter">FPS: --</div>
    <div id="kill-counter">KILLS: 0</div>
    <div id="health-container">
        <div id="health-text">HEALTH: 100%</div>
        <div id="health-bar"></div>
    </div>

    <div id="menu-container">
        <div class="menu-card">
            <h1>GRASSLAND PRO</h1>
            <button class="btn" id="start-btn">Resume Simulator</button>
            <button class="btn" id="open-weapons">Loadout</button>
            <button class="btn" id="open-settings">Graphics</button>
        </div>
    </div>

    <div id="weapon-container">
        <div class="menu-card">
            <h2>SELECT ARSENAL</h2>
            <button class="btn" id="select-rifle">Assault Rifle</button>
            <button class="btn" id="select-shotgun">Shotgun</button>
            <button class="btn" id="select-sniper">Sniper</button>
            <button class="btn" id="select-smg">SMG</button>
            <button class="btn" id="select-pistol">Pistol</button>
            <button class="btn" id="back-from-weapons" style="background:rgba(255,255,255,0.1); color:white;">Back</button>
        </div>
    </div>

    <div id="settings-container">
        <div class="menu-card">
            <h2>GRAPHICS</h2>
            
            <div class="setting-row">
                <span>RESOLUTION:</span>
                <select id="res-toggle">
                    <option value="native">Native (Window)</option>
                    <option value="1080">1080p (FHD)</option>
                    <option value="1440">1440p (QHD)</option>
                    <option value="2160">4K (UHD)</option>
                    <option value="720">720p (Performance)</option>
                </select>
            </div>

            <div class="setting-row">
                <span>MAX FPS:</span>
                <select id="fps-toggle">
                    <option value="unlocked">Unlocked</option>
                    <option value="120">120 FPS</option>
                    <option value="60">60 FPS</option>
                    <option value="30">30 FPS</option>
                </select>
            </div>

            <div class="setting-row">
                <span>MOTION BLUR:</span>
                <select id="blur-toggle"><option>OFF</option><option>ON</option></select>
            </div>
            
            <button class="btn" id="back-to-menu">Apply Settings</button>
        </div>
    </div>

    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        // --- OPTIMIZED ENGINE SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a1128); 
        scene.fog = new THREE.FogExp2(0x0a1128, 0.008); 

        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 800);
        const renderer = new THREE.WebGLRenderer({ antialias: true, precision: "highp", powerPreference: "high-performance" });
        
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.1;
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap; 
        document.body.appendChild(renderer.domElement);

        const menus = { main: document.getElementById('menu-container'), wpn: document.getElementById('weapon-container'), set: document.getElementById('settings-container') };
        const fpsEl = document.getElementById('fps-counter');
        const blurToggle = document.getElementById('blur-toggle');
        const resToggle = document.getElementById('res-toggle');
        const fpsToggle = document.getElementById('fps-toggle');

        let playerHealth = 100, killCount = 0;
        const healthBarEl = document.getElementById('health-bar'), healthTextEl = document.getElementById('health-text'), damageFlashEl = document.getElementById('damage-flash'), killCounterEl = document.getElementById('kill-counter');

        function damagePlayer(amount) {
            playerHealth = Math.max(0, playerHealth - amount);
            healthBarEl.style.width = playerHealth + '%';
            healthTextEl.innerText = "HEALTH: " + Math.round(playerHealth) + "%";
            damageFlashEl.style.opacity = "1";
            setTimeout(() => damageFlashEl.style.opacity = "0", 150);
            if(playerHealth <= 0) { alert("GAME OVER. KILLS: " + killCount); location.reload(); }
        }

        // Resolution Scaler Logic
        function updateResolution() {
            const mode = resToggle.value;
            let targetWidth = window.innerWidth;
            let targetHeight = window.innerHeight;

            if (mode !== 'native') {
                const targetLines = parseInt(mode);
                const currentAspect = window.innerWidth / window.innerHeight;
                targetHeight = targetLines;
                targetWidth = Math.round(targetLines * currentAspect);
            }

            renderer.setSize(targetWidth, targetHeight, false); 
            renderer.domElement.style.width = '100vw';
            renderer.domElement.style.height = '100vh';
            
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
        }

        document.getElementById('open-settings').onclick = () => { menus.main.style.display = 'none'; menus.set.style.display = 'flex'; };

        let frames = 0, prevTime = performance.now();
        function updateFPS() {
            frames++; const time = performance.now();
            if (time >= prevTime + 1000) { fpsEl.innerText = "FPS: " + frames; frames = 0; prevTime = time; }
        }

        // --- OPTIMIZED LIGHTING ---
        const sun = new THREE.DirectionalLight(0xfff3e0, 4.0);
        sun.position.set(100, 150, 80);
        sun.castShadow = true;
        sun.shadow.mapSize.width = 2048; 
        sun.shadow.mapSize.height = 2048;
        const d = 120;
        sun.shadow.camera.left = -d; sun.shadow.camera.right = d;
        sun.shadow.camera.top = d; sun.shadow.camera.bottom = -d;
        scene.add(sun);
        scene.add(new THREE.AmbientLight(0x3a4f7c, 0.7));

        // --- GROUND ---
        const floorGeo = new THREE.PlaneGeometry(1500, 1500);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x0c1a0a, roughness: 0.9, metalness: 0.1 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

        // --- BALANCED FOLIAGE ---
        const grassCount = 12000;
        const grassGeo = new THREE.PlaneGeometry(0.15, 0.8); grassGeo.translate(0, 0.4, 0); 
        const grassMat = new THREE.MeshStandardMaterial({ color: 0x449933, roughness: 0.7, side: THREE.DoubleSide });
        const instancedGrass = new THREE.InstancedMesh(grassGeo, grassMat, grassCount);
        const dummy = new THREE.Object3D();
        for (let i = 0; i < grassCount; i++) {
            dummy.position.set(Math.random() * 200 - 100, 0, Math.random() * 200 - 100);
            dummy.rotation.y = Math.random() * Math.PI;
            dummy.rotation.x = (Math.random() - 0.5) * 0.2; 
            const scale = 0.8 + Math.random() * 0.4; dummy.scale.set(scale, scale, scale);
            dummy.updateMatrix(); instancedGrass.setMatrixAt(i, dummy.matrix);
        }
        instancedGrass.receiveShadow = true; scene.add(instancedGrass);

        const particles = [];
        const bloodGeo = new THREE.BoxGeometry(0.08, 0.08, 0.08);
        const bloodMat = new THREE.MeshStandardMaterial({ color: 0xaa0000, roughness: 0.3 });
        function spawnBlood(pos) {
            for(let i=0; i<8; i++) {
                const p = new THREE.Mesh(bloodGeo, bloodMat); p.position.copy(pos);
                const vel = new THREE.Vector3((Math.random()-0.5)*5, Math.random()*5 + 2, (Math.random()-0.5)*5);
                scene.add(p); particles.push({ mesh: p, vel: vel, life: 1.0 });
            }
        }

        // --- VEHICLE ---
        class GolfCart {
            constructor() {
                this.group = new THREE.Group();
                const bodyMat = new THREE.MeshStandardMaterial({ color: 0xdcdcdc, roughness: 0.2, metalness: 0.7 }); 
                const metalMat = new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 0.9, roughness: 0.1 }); 
                const seatMat = new THREE.MeshStandardMaterial({ color: 0x15151c, roughness: 0.8 }); 
                const tireMat = new THREE.MeshStandardMaterial({ color: 0x09090b, roughness: 0.9 });
                const rimMat = new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 0.8, roughness: 0.2 });

                const base = new THREE.Mesh(new THREE.BoxGeometry(2, 0.2, 3.8), bodyMat); base.position.y = 0.4; base.castShadow = true;
                const fSeat = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.3, 0.9), seatMat); fSeat.position.set(0, 0.6, -0.1); fSeat.castShadow = true;
                const bSeat = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.3, 0.8), seatMat); bSeat.position.set(0, 0.6, -1.3); bSeat.castShadow = true;
                const dash = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.4, 0.4), bodyMat); dash.position.set(0, 1.0, 1.1); dash.castShadow = true;
                const roof = new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.1, 3.2), bodyMat); roof.position.set(0, 2.7, -0.2); roof.castShadow = true;
                this.group.add(base, fSeat, bSeat, dash, roof);

                [[-0.9, 1.2], [0.9, 1.2], [-0.9, -1.6], [0.9, -1.6]].forEach(p => {
                    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 2.3, 12), metalMat); pole.position.set(p[0], 1.55, p[1]); pole.castShadow = true;
                    this.group.add(pole);
                });

                const winFrame = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.8, 0.05), metalMat); winFrame.position.set(0, 1.4, 1.2); winFrame.castShadow = true;
                this.group.add(winFrame);

                this.wheels = []; this.frontWheelHubs = [];
                const wheelGeo = new THREE.CylinderGeometry(0.38, 0.38, 0.28, 24); 
                const rimGeo = new THREE.CylinderGeometry(0.22, 0.22, 0.29, 12);
                const wPos = [{x:-0.98, z:1.3, f:true}, {x:0.98, z:1.3, f:true}, {x:-0.98, z:-1.3, f:false}, {x:0.98, z:-1.3, f:false}];

                wPos.forEach(p => {
                    const wg = new THREE.Group();
                    const tire = new THREE.Mesh(wheelGeo, tireMat); tire.rotation.z = Math.PI/2; tire.castShadow = true;
                    const rim = new THREE.Mesh(rimGeo, rimMat); rim.rotation.z = Math.PI/2;
                    wg.add(tire, rim);
                    if(p.f) { const hub = new THREE.Group(); hub.position.set(p.x, 0.38, p.z); hub.add(wg); this.group.add(hub); this.frontWheelHubs.push(hub); } 
                    else { wg.position.set(p.x, 0.38, p.z); this.group.add(wg); }
                    this.wheels.push(wg);
                });

                this.steeringColumn = new THREE.Group(); this.steeringColumn.position.set(-0.5, 1.6, 0.7); this.steeringColumn.rotation.x = Math.PI / 12;
                const stand = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 1.4, 12), metalMat); stand.position.set(0, -0.6, 0.2); stand.rotation.x = -Math.PI / 8;
                this.steeringColumn.add(stand);

                this.wheelShaft = new THREE.Group();
                const wheel = new THREE.Mesh(new THREE.TorusGeometry(0.25, 0.025, 12, 24), seatMat);
                this.wheelShaft.add(wheel);

                const createHand = (isLeft) => {
                    const h = new THREE.Group(); const skin = new THREE.MeshStandardMaterial({ color: 0xdbac98, roughness: 0.8 });
                    const palm = new THREE.Mesh(new THREE.SphereGeometry(0.08, 8, 8), skin); palm.scale.set(1, 0.4, 1.2); h.add(palm);
                    const joints = []; [-0.04, 0, 0.04].forEach(x => {
                        const root = new THREE.Group(); root.position.set(isLeft ? x : -x, 0, 0.05);
                        const seg = new THREE.Mesh(new THREE.CapsuleGeometry(0.015, 0.05, 4, 8), skin); seg.rotation.x = 1.1;
                        const jnt = new THREE.Group(); jnt.add(seg); root.add(jnt); h.add(root); joints.push(jnt);
                    }); return { h, joints };
                };
                const L = createHand(true); const R = createHand(false);
                L.h.position.set(-0.2, 0, 0.05); R.h.position.set(0.2, 0, 0.05);
                this.handJoints = [...L.joints, ...R.joints];
                this.wheelShaft.add(L.h, R.h); this.steeringColumn.add(this.wheelShaft); this.group.add(this.steeringColumn);

                this.group.position.set(25, 0, 25); scene.add(this.group);
                this.speed = 0; this.steerAngle = 0;
            }
            update(move, delta) {
                if (move.w) this.speed = THREE.MathUtils.lerp(this.speed, 1.2, 0.05);
                else if (move.s) this.speed = THREE.MathUtils.lerp(this.speed, -0.5, 0.05);
                else this.speed *= 0.95;
                const targetSteer = move.a ? 0.85 : (move.d ? -0.85 : 0);
                this.steerAngle = THREE.MathUtils.lerp(this.steerAngle, targetSteer, 0.12);
                this.group.rotation.y += this.steerAngle * this.speed * 2.2 * delta;
                this.group.translateZ(this.speed * 22 * delta);
                this.wheels.forEach(w => w.rotation.x += this.speed * 55 * delta);
                this.frontWheelHubs.forEach(hub => hub.rotation.y = this.steerAngle * 0.6);
                this.wheelShaft.rotation.z = this.steerAngle * 2.5;
                this.handJoints.forEach(j => j.rotation.x = THREE.MathUtils.lerp(j.rotation.x, move.w ? 1.4 : 1.1, 0.1));
            }
        }
        const cart = new GolfCart();

        // --- ENEMIES ---
        class Enemy {
    constructor(position) {
        this.group = new THREE.Group();
        const skinCol = new THREE.Color().setHSL(0.04, 0.4, 0.15 + Math.random() * 0.15);
        const clothCol = new THREE.Color().setHSL(0.55 + Math.random() * 0.1, 0.3, 0.1);
        
        this.skinMat = new THREE.MeshStandardMaterial({ color: skinCol, roughness: 0.7 });
        this.clothMat = new THREE.MeshStandardMaterial({ color: clothCol, roughness: 0.85 });
        const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff3333 }); 
        
        this.torso = new THREE.Mesh(new THREE.BoxGeometry(0.75, 1.15, 0.5), this.clothMat); this.torso.position.y = 1.75; this.torso.castShadow = true;
        this.head = new THREE.Mesh(new THREE.BoxGeometry(0.48, 0.48, 0.48), this.skinMat); this.head.position.y = 2.6; this.head.castShadow = true;
        
        // Fixed positioning for jaw and eyes relative to the head
        const jaw = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.12, 0.22), this.skinMat); jaw.position.set(0, -0.16, 0.1);
        const lEye = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.06, 0.12), eyeMat); lEye.position.set(-0.14, 0.06, 0.22);
        const rEye = lEye.clone(); rEye.position.set(0.14, 0.06, 0.22);
        this.head.add(jaw, lEye, rEye);
        
        this.lArm = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.95, 0.22), this.skinMat); this.lArm.position.set(-0.5, 2.15, 0.3); this.lArm.rotation.x = -1.3; this.lArm.castShadow = true;
        this.rArm = this.lArm.clone(); this.rArm.position.set(0.45, 2.15, 0.3);
        this.lLeg = new THREE.Mesh(new THREE.BoxGeometry(0.28, 1.25, 0.28), this.clothMat); this.lLeg.position.set(-0.24, 0.62, 0); this.lLeg.castShadow = true;
        this.rLeg = this.lLeg.clone(); this.rLeg.position.set(0.22, 0.62, 0);
        
        this.group.add(this.torso, this.head, this.lArm, this.rArm, this.lLeg, this.rLeg);
        this.group.position.copy(position);
        
        // --- CHANGED: Shorter height adjustment ---
        // Your player camera height is set to 1.8. 
        // This keeps enemies around 1.4 to 1.6 units tall, making them noticeably shorter than you.
        this.group.scale.setScalar(0.75 + Math.random() * 0.1);
        
        scene.add(this.group);
        
        this.isDead = false; this.deathTime = 0; this.speed = 4.0 + Math.random() * 2.5;
        this.animOff = Math.random() * 6.28; this.physicsVel = new THREE.Vector3(); this.rotVel = new THREE.Vector3();
        this.attackCooldown = 0;
    }
            }
            die(hitDirection, power) {
                if (this.isDead) return;
                this.isDead = true; killCount++; killCounterEl.innerText = "KILLS: " + killCount;
                this.physicsVel.copy(hitDirection).multiplyScalar(power);
                this.rotVel.set(Math.random()-0.5, Math.random()-0.5, Math.random()-0.5).multiplyScalar(20);
                this.skinMat.color.setHex(0x220202); this.clothMat.color.setHex(0x110101);
            }
            update(delta, playerPos) {
                if (!this.isDead) {
                    const dist = this.group.position.distanceTo(playerPos);
                    const dir = new THREE.Vector3().subVectors(playerPos, this.group.position); dir.y = 0; dir.normalize();
                    if (dist > 3.5) { this.group.position.addScaledVector(dir, this.speed * delta); } 
                    else { this.attackCooldown -= delta; if(this.attackCooldown <= 0) { damagePlayer(12); this.attackCooldown = 0.8; } }
                    this.group.lookAt(playerPos.x, 0, playerPos.z);
                    const t = (performance.now() * 0.006) + this.animOff;
                    this.lLeg.rotation.x = Math.sin(t) * 0.45; this.rLeg.rotation.x = Math.cos(t) * 0.45;
                    this.group.position.y = Math.abs(Math.sin(t * 2)) * 0.12;
                } else {
                    this.group.position.addScaledVector(this.physicsVel, delta);
                    this.group.rotation.x += this.rotVel.x * delta; this.group.rotation.y += this.rotVel.y * delta;
                    this.physicsVel.multiplyScalar(0.95);
                    if (this.group.position.y > 0.6) this.physicsVel.y -= 18 * delta;
                    else { this.group.position.y = 0.6; this.physicsVel.y *= -0.15; }
                    this.deathTime += delta;
                    if (this.deathTime > 1.2) { 
                        this.group.scale.multiplyScalar(0.92); 
                        if (this.group.scale.x <= 0.05) { 
                            this.group.traverse(c => { if (c.geometry) c.geometry.dispose(); if (c.material) c.material.dispose(); });
                            scene.remove(this.group); return true; 
                        } 
                    }
                }
                return false;
            }
        }
        const enemies = [];
        function spawnEnemies(count) { for(let i=0; i<count; i++) enemies.push(new Enemy(new THREE.Vector3((Math.random()-0.5)*200, 0, (Math.random()-0.5)*200-100))); }
        spawnEnemies(15);

        // --- HIGH-DETAIL WEAPONS DESIGN ---
        const viewmodel = new THREE.Group();
        const matMatted = new THREE.MeshStandardMaterial({ color: 0x1c1d22, roughness: 0.5, metalness: 0.7 });
        const matSteel = new THREE.MeshStandardMaterial({ color: 0x4a4d53, roughness: 0.2, metalness: 0.95 });
        const matPoly = new THREE.MeshStandardMaterial({ color: 0x0f1012, roughness: 0.7, metalness: 0.2 });
        const matGold = new THREE.MeshStandardMaterial({ color: 0xcca344, roughness: 0.3, metalness: 0.9 });
        const matGlass = new THREE.MeshBasicMaterial({ color: 0x66ccff, opacity: 0.6, transparent: true });

        // Assault Rifle
        const buildRifle = () => {
            const g = new THREE.Group();
            const rec = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.12, 0.5), matMatted);
            const hand = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.09, 0.35), matPoly); hand.position.set(0, -0.01, -0.4);
            const stock = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.11, 0.28), matPoly); stock.position.set(0, 0.02, 0.38);
            const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.4, 8), matSteel); barrel.rotation.x = Math.PI/2; barrel.position.set(0, 0.02, -0.7);
            const mag = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.22, 0.12), matPoly); mag.position.set(0, -0.14, -0.15); mag.rotation.x = 0.2;
            const sight = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.04, 0.04), matSteel); sight.position.set(0, 0.08, -0.55);
            g.add(rec, hand, stock, barrel, mag, sight); return g;
        };

        // Tactical Shotgun
        const buildShotgun = () => {
            const g = new THREE.Group();
            const rec = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.13, 0.45), matSteel);
            const tube = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.022, 0.5, 8), matMatted); tube.rotation.x = Math.PI/2; tube.position.set(0, -0.02, -0.45);
            const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.52, 8), matSteel); barrel.rotation.x = Math.PI/2; barrel.position.set(0, 0.03, -0.46);
            const pump = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.08, 0.25), matPoly); pump.position.set(0, -0.03, -0.38);
            const stock = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.14, 0.32), matPoly); stock.position.set(0, -0.02, 0.35); stock.rotation.x = -0.05;
            g.add(rec, tube, barrel, pump, stock); return g;
        };

        // Bolt-Action Sniper
        const buildSniper = () => {
            const g = new THREE.Group();
            const frame = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.1, 0.7), matPoly);
            const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.016, 0.012, 0.8, 8), matSteel); barrel.rotation.x = Math.PI/2; barrel.position.set(0, 0.03, -0.75);
            const bolt = new THREE.Mesh(new THREE.CylinderGeometry(0.01, 0.01, 0.15, 8), matGold); bolt.rotation.x = Math.PI/2; bolt.position.set(0.04, 0.04, 0.05);
            const scopeTube = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.02, 0.3, 8), matMatted); scopeTube.rotation.x = Math.PI/2; scopeTube.position.set(0, 0.11, -0.05);
            const scopeLens = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.022, 0.01, 8), matGlass); scopeLens.rotation.x = Math.PI/2; scopeLens.position.set(0, 0.11, -0.2);
            frame.add(scopeTube, scopeLens); g.add(frame, barrel, bolt); return g;
        };

        // Compact SMG
        const buildSMG = () => {
            const g = new THREE.Group();
            const rec = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.15, 0.38), matMatted);
            const mag = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.28, 0.06), matPoly); mag.position.set(0, -0.18, -0.08);
            const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.018, 0.18, 8), matSteel); barrel.rotation.x = Math.PI/2; barrel.position.set(0, 0.03, -0.28);
            const grip = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.14, 0.08), matPoly); grip.position.set(0, -0.13, 0.12); grip.rotation.x = 0.3;
            g.add(rec, mag, barrel, grip); return g;
        };

        // Sidearm Pistol
        const buildPistol = () => {
            const g = new THREE.Group();
            const slide = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.06, 0.24), matSteel); slide.position.y = 0.05;
            const frame = new THREE.Mesh(new THREE.BoxGeometry(0.046, 0.05, 0.22), matPoly); frame.position.set(0, 0.01, 0.01);
            const grip = new THREE.Mesh(new THREE.BoxGeometry(0.045, 0.13, 0.06), matPoly); grip.position.set(0, -0.07, 0.06); grip.rotation.x = 0.35;
            const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.08, 8), matGold); barrel.rotation.x = Math.PI/2; barrel.position.set(0, 0.05, -0.13);
            g.add(slide, frame, grip, barrel); return g;
        };

        const rifle = buildRifle();
        const shotgun = buildShotgun(); shotgun.visible = false;
        const sniper = buildSniper(); sniper.visible = false;
        const smg = buildSMG(); smg.visible = false;
        const pistol = buildPistol(); pistol.visible = false;

        viewmodel.add(rifle, shotgun, sniper, smg, pistol); 
        viewmodel.position.set(0.42, -0.38, -0.7);
        camera.add(viewmodel); scene.add(camera);

        const bullets = [];
        const bulletGeo = new THREE.CylinderGeometry(0.015, 0.015, 0.4, 6); bulletGeo.rotateX(Math.PI/2);
        const bulletMat = new THREE.MeshBasicMaterial({ color: 0xffcc44 });

        function fireWeapon() {
            let count = 1, spread = 0, curRecoil = 0.22;
            if (shotgun.visible) { count = 10; spread = 0.12; }
            if (smg.visible) { spread = 0.06; curRecoil = 0.09; }
            recoil = curRecoil;
            for(let i=0; i<count; i++) {
                const b = new THREE.Mesh(bulletGeo, bulletMat); viewmodel.getWorldPosition(b.position);
                const dir = new THREE.Vector3(); camera.getWorldDirection(dir);
                dir.x += (Math.random()-0.5)*spread; dir.y += (Math.random()-0.5)*spread; dir.normalize();
                b.lookAt(b.position.clone().add(dir)); scene.add(b); bullets.push({ mesh: b, dir: dir, time: 0 });
            }
        }

        const controls = new PointerLockControls(camera, document.body);
        document.getElementById('start-btn').onclick = () => controls.lock();
        document.getElementById('open-weapons').onclick = () => { menus.main.style.display='none'; menus.wpn.style.display='flex'; };
        document.getElementById('back-from-weapons').onclick = () => { menus.wpn.style.display='none'; menus.main.style.display='flex'; };

        const hideAll = () => [rifle, shotgun, sniper, smg, pistol].forEach(g => g.visible = false);
        document.getElementById('select-rifle').onclick = () => { hideAll(); rifle.visible=true; menus.wpn.style.display='none'; controls.lock(); };
        document.getElementById('select-shotgun').onclick = () => { hideAll(); shotgun.visible=true; menus.wpn.style.display='none'; controls.lock(); };
        document.getElementById('select-sniper').onclick = () => { hideAll(); sniper.visible=true; menus.wpn.style.display='none'; controls.lock(); };
        document.getElementById('select-smg').onclick = () => { hideAll(); smg.visible=true; menus.wpn.style.display='none'; controls.lock(); };
        document.getElementById('select-pistol').onclick = () => { hideAll(); pistol.visible=true; menus.wpn.style.display='none'; controls.lock(); };

        document.getElementById('back-to-menu').onclick = () => { 
            menus.set.style.display = 'none'; 
            menus.main.style.display = 'flex'; 
            updateResolution(); 
        };

        controls.addEventListener('lock', () => Object.values(menus).forEach(m => m.style.display = 'none'));
        controls.addEventListener('unlock', () => menus.main.style.display = 'flex');

        let move = { w: false, s: false, a: false, d: false }, velocity = new THREE.Vector3(), recoil = 0, isDriving = false, spawnTimer = 0;

        window.onmousedown = () => { if (controls.isLocked && !isDriving) fireWeapon(); };
        document.addEventListener('keydown', (e) => { 
            const k = e.key.toLowerCase(); if (move.hasOwnProperty(k)) move[k] = true;
            if (k === 'e' && controls.isLocked && camera.position.distanceTo(cart.group.position) < 7) { isDriving = !isDriving; viewmodel.visible = !isDriving; }
        });
        document.addEventListener('keyup', (e) => { 
            const k = e.key.toLowerCase();
            if (move.hasOwnProperty(k)) move[k] = false; 
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(clock.getDelta(), 0.1);
            updateFPS();

            // Handle Bullet Physics & Tracing
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.mesh.position.addScaledVector(b.dir, 450 * delta);
                b.time += delta;

                let hit = false;
                for (let j = enemies.length - 1; j >= 0; j--) {
                    const enemy = enemies[j];
                    if (!enemy.isDead && b.mesh.position.distanceTo(enemy.group.position) < 2.5) {
                        spawnBlood(b.mesh.position);
                        enemy.die(b.dir, 35);
                        hit = true;
                        break;
                    }
                }

                if (hit || b.time > 1.5 || b.mesh.position.y < 0) {
                    scene.remove(b.mesh);
                    b.mesh.geometry.dispose();
                    b.mesh.material.dispose();
                    bullets.splice(i, 1);
                }
            }

            // Handle Blood Particles Physics
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.mesh.position.addScaledVector(p.vel, delta);
                p.vel.y -= 9.8 * delta; // Gravity
                p.life -= delta;
                if (p.life <= 0 || p.mesh.position.y < 0) {
                    scene.remove(p.mesh);
                    p.mesh.geometry.dispose();
                    p.mesh.material.dispose();
                    particles.splice(i, 1);
                }
            }

            // Engine / Framework Updates
            if (controls.isLocked) {
                if (isDriving) {
                    cart.update(move, delta);
                    // Anchor camera inside the Golf Cart dashboard view
                    const idealOffset = new THREE.Vector3(-0.5, 1.9, 0.2);
                    idealOffset.applyQuaternion(cart.group.quaternion);
                    camera.position.copy(cart.group.position).add(idealOffset);
                } else {
                    // Standard First-Person walking controls
                    const speed = 14.0;
                    velocity.z = (Number(move.w) - Number(move.s)) * speed * delta;
                    velocity.x = (Number(move.d) - Number(move.a)) * speed * delta;
                    controls.moveForward(velocity.z);
                    controls.moveRight(velocity.x);
                    camera.position.y = 1.8; // Prevent falling beneath ground
                }
            }

            // Smooth weapon sway / return from kickback
            recoil = THREE.MathUtils.lerp(recoil, 0, 10 * delta);
            viewmodel.position.z = -0.7 + recoil;
            viewmodel.position.y = -0.38 - (recoil * 0.3);

            // Dynamically manage enemy list and update arrays
            for (let i = enemies.length - 1; i >= 0; i--) {
                if (enemies[i].update(delta, camera.position)) {
                    enemies.splice(i, 1);
                }
            }

            // Spawn incoming wave triggers
            spawnTimer += delta;
            if (spawnTimer > 4.0 && enemies.filter(e => !e.isDead).length < 8) {
                spawnEnemies(5);
                spawnTimer = 0;
            }

        // --- TICK / MAIN ANIMATION LOOP ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const delta = Math.min(clock.getDelta(), 0.1); // Cap delta to prevent clipping issues on lag spikes
            updateFPS();

            if (controls.isLocked) {
                if (isDriving) {
                    // --- DRIVING MODE ---
                    cart.update(move, delta);
                    
                    // Attach camera to the golf cart (overhead/back view)
                    const relativeCameraOffset = new THREE.Vector3(0, 2.5, -5);
                    const cameraOffset = relativeCameraOffset.applyMatrix4(cart.group.matrixWorld);
                    camera.position.copy(cameraOffset);
                    
                    // Make camera look slightly ahead of the cart
                    const targetLook = new THREE.Vector3(0, 1, 4).applyMatrix4(cart.group.matrixWorld);
                    camera.lookAt(targetLook);

                    // Optional: Run over enemies with the cart
                    enemies.forEach(enemy => {
                        if (!enemy.isDead && cart.group.position.distanceTo(enemy.group.position) < 3.0 && Math.abs(cart.speed) > 0.2) {
                            const hitDir = new THREE.Vector3().subVectors(enemy.group.position, cart.group.position).normalize();
                            enemy.die(hitDir, Math.abs(cart.speed) * 35);
                            spawnBlood(enemy.group.position);
                        }
                    });
                } else {
                    // --- FPS WALKING MODE ---
                    const speedMultiplier = 18.0;
                    velocity.x = (Number(move.d) - Number(move.a)) * speedMultiplier * delta;
                    velocity.z = (Number(move.w) - Number(move.s)) * speedMultiplier * delta;

                    controls.moveRight(velocity.x);
                    controls.moveForward(velocity.z);
                    
                    // Keep player glued to the ground level
                    camera.position.y = 2.6; 
                }

                // --- SPAWN SYSTEM ---
                spawnTimer += delta;
                if (spawnTimer > 4.0 && enemies.filter(e => !e.isDead).length < 25) {
                    spawnEnemies(3);
                    spawnTimer = 0;
                }
            }

            // --- ANIMATE VIEWMODEL RECOIL ---
            recoil = THREE.MathUtils.lerp(recoil, 0, 0.1);
            viewmodel.position.z = -0.7 - recoil;
            viewmodel.position.y = -0.38 + (recoil * 0.5);

            // --- UPDATE BULLETS & RAYCAST COLLISIONS ---
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.time += delta;
                const speed = 180 * delta;
                
                // Save previous position for raycasting trail accuracy
                const oldPos = b.mesh.position.clone();
                b.mesh.position.addScaledVector(b.dir, speed);

                // Setup raycast from old position to new position to detect hits
                const raycaster = new THREE.Raycaster(oldPos, b.dir, 0, speed + 0.5);
                
                let hitDetected = false;
                for (let j = 0; j < enemies.length; j++) {
                    const enemy = enemies[j];
                    if (enemy.isDead) continue;

                    const intersects = raycaster.intersectObjects(enemy.group.children);
                    if (intersects.length > 0) {
                        hitDetected = true;
                        enemy.die(b.dir, 15);
                        spawnBlood(intersects[0].point);
                        break;
                    }
                }

                // Remove bullet if it hits something or travels for more than 2 seconds
                if (hitDetected || b.time > 2.0) {
                    scene.remove(b.mesh);
                    b.mesh.geometry.dispose();
                    b.mesh.material.dispose();
                    bullets.splice(i, 1);
                }
            }

            // --- UPDATE PARTICLES (BLOOD SPLATTERS) ---
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.mesh.position.addScaledVector(p.vel, delta);
                p.vel.y -= 9.8 * delta; // Gravity effect
                p.life -= delta * 1.5;
                p.mesh.scale.setScalar(p.life);

                if (p.life <= 0) {
                    scene.remove(p.mesh);
                    p.mesh.geometry.dispose();
                    p.mesh.material.dispose();
                    particles.splice(i, 1);
                }
            }

            // --- UPDATE ENEMIES ---
            const playerPosForAI = isDriving ? cart.group.position : camera.position;
            for (let i = enemies.length - 1; i >= 0; i--) {
                const isRemoved = enemies[i].update(delta, playerPosForAI);
                if (isRemoved) {
                    enemies.splice(i, 1);
                }
            }

            // Apply screen motion blur effect based on toggle selection
            if (blurToggle.value === "ON" && controls.isLocked) {
                renderer.domElement.style.filter = `blur(${Math.min(2, Math.abs(cart.speed) * 1.5)}px)`;
            } else {
                renderer.domElement.style.filter = 'none';
            }

            renderer.render(scene, camera);
        }

        // Set starting position for the player camera so you aren't under the map
        camera.position.set(25, 1.8, 32);
        
        // Start the engine loop
        animate();
    </script>
</body>
</html>
