<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>shooterFC</title>
    <style>
        body { margin: 0; overflow: hidden; background: #0a0f1d; font-family: 'Segoe UI', system-ui, sans-serif; user-select: none; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 6px; height: 6px; background: rgba(255,255,255,0.9); border-radius: 50%; transform: translate(-50%, -50%); z-index: 10; pointer-events: none; box-shadow: 0 0 4px rgba(0,0,0,0.8); }
        
        #menu-container, #settings-container, #weapon-container { 
            position: absolute; inset: 0; 
            background: radial-gradient(circle at center, rgba(10, 15, 30, 0.7) 0%, rgba(5, 7, 12, 0.98) 100%); 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            color: white; z-index: 2000; backdrop-filter: blur(15px); pointer-events: all; 
        }
        
        #settings-container, #weapon-container { display: none; }
        .menu-card { 
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.01) 100%); 
            padding: 40px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.08); 
            text-align: center; width: 360px; box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }
        
        h1 { letter-spacing: 3px; margin-bottom: 20px; font-weight: 800; font-size: 28px; color: #7cfc00; text-shadow: 0 0 15px rgba(124,252,0,0.3); }
        h2 { letter-spacing: 2px; margin-bottom: 20px; font-weight: 700; }
        
        .btn { 
            width: 100%; padding: 15px; margin: 10px 0; 
            background: linear-gradient(135deg, #ffffff 0%, #e0e0e0 100%); 
            color: #000; border: none; border-radius: 8px; 
            font-weight: 700; cursor: pointer; text-transform: uppercase; 
            transition: all 0.2s ease-in-out;
        }
        .btn:hover { 
            background: linear-gradient(135deg, #7cfc00 0%, #55aa44 100%); 
            color: white; transform: translateY(-2px); 
            box-shadow: 0 6px 20px rgba(85,170,68,0.4);
        }
        
        .setting-row { margin: 18px 0; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
        .setting-row select { padding: 6px 12px; background: #1a1a2e; color: white; border: 1px solid rgba(255,255,255,0.2); border-radius: 4px; outline: none; width: 140px; }
        
        #fps-counter { position: absolute; bottom: 15px; right: 20px; color: #7cfc00; font-family: monospace; font-size: 14px; font-weight: bold; z-index: 5; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
        #kill-counter { position: absolute; top: 25px; right: 30px; color: white; font-size: 24px; font-weight: 800; z-index: 5; text-shadow: 0 2px 8px rgba(0,0,0,0.6); text-align: right; }
        #wave-banner { font-size: 14px; color: #7cfc00; font-weight: 600; letter-spacing: 1px; }
        #damage-flash { position: absolute; inset: 0; background: radial-gradient(circle, rgba(255,0,0,0) 30%, rgba(200,0,0,0.5) 100%); opacity: 0; pointer-events: none; z-index: 1500; transition: opacity 0.1s; }
        
        #health-container { position: absolute; bottom: 30px; left: 30px; width: 240px; height: 12px; background: rgba(5,7,12,0.8); border: 1px solid rgba(255,255,255,0.15); border-radius: 6px; overflow: hidden; z-index: 10; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        #health-bar { width: 100%; height: 100%; background: linear-gradient(90deg, #ff3333 0%, #ff5555 100%); transition: width 0.2s ease-out; }
        #health-text { position: absolute; width: 100%; text-align: center; color: white; font-weight: 700; font-size: 11px; letter-spacing: 1px; line-height: 12px; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }

        #ammo-display { position: absolute; bottom: 30px; right: 30px; color: white; font-family: monospace; font-size: 28px; font-weight: 900; z-index: 10; text-shadow: 0 2px 6px rgba(0,0,0,0.8); text-align: right; }
        #weapon-tag { font-size: 12px; font-family: 'Segoe UI', sans-serif; color: #aaa; letter-spacing: 2px; text-transform: uppercase; margin-bottom: -4px; }
        #reload-prompt { position: absolute; top: 55%; left: 50%; transform: translate(-50%, -50%); color: #ff3333; font-weight: bold; font-size: 14px; letter-spacing: 1px; text-shadow: 0 2px 4px rgba(0,0,0,0.9); display: none; z-index: 10; animation: blink 1s infinite; }
        
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    </style>
</head>
<body>
    <div id="damage-flash"></div>
    <div id="crosshair"></div>
    <div id="fps-counter">FPS: --</div>
    <div id="reload-prompt">PRESS 'R' TO RELOAD</div>
    <div id="kill-counter">
        <div id="wave-banner">WAVE 1</div>
        KILLS: <span id="kill-val">0</span>
    </div>
    <div id="health-container">
        <div id="health-text">HEALTH: 100%</div>
        <div id="health-bar"></div>
    </div>
    <div id="ammo-display">
        <div id="weapon-tag">Assault Rifle</div>
        <span id="clip-val">30</span>/<span id="reserve-val">120</span>
    </div>

    <div id="menu-container">
        <div class="menu-card">
            <h1>GRASSLAND PRO</h1>
            <button class="btn" id="start-btn">Resume Simulator</button>
            <button class="btn" id="open-weapons">Loadout</button>
            <button class="btn" id="open-settings">Graphics</button>
        </div>
    </div>

    <div id="weapon-container">
        <div class="menu-card">
            <h2>SELECT ARSENAL</h2>
            <button class="btn" id="select-rifle">Assault Rifle (Key 1)</button>
            <button class="btn" id="select-shotgun">Shotgun (Key 2)</button>
            <button class="btn" id="select-sniper">Sniper (Key 3)</button>
            <button class="btn" id="select-smg">SMG (Key 4)</button>
            <button class="btn" id="select-pistol">Pistol (Key 5)</button>
            <button class="btn" id="back-from-weapons" style="background:rgba(255,255,255,0.1); color:white;">Back</button>
        </div>
    </div>

    <div id="settings-container">
        <div class="menu-card">
            <h2>GRAPHICS</h2>
            
            <div class="setting-row">
                <span>RESOLUTION:</span>
                <select id="res-toggle">
                    <option value="native">Native (Window)</option>
                    <option value="1080">1080p (FHD)</option>
                    <option value="1440">1440p (QHD)</option>
                    <option value="2160">4K (UHD)</option>
                    <option value="720">720p (Performance)</option>
                </select>
            </div>

            <div class="setting-row">
                <span>MAX FPS:</span>
                <select id="fps-toggle">
                    <option value="unlocked">Unlocked</option>
                    <option value="120">120 FPS</option>
                    <option value="60">60 FPS</option>
                    <option value="30">30 FPS</option>
                </select>
            </div>

            <div class="setting-row">
                <span>MOTION BLUR:</span>
                <select id="blur-toggle"><option>OFF</option><option>ON</option></select>
            </div>
            
            <button class="btn" id="back-to-menu">Apply Settings</button>
        </div>
    </div>

    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        // --- SYNTHESIZED PROCEDURAL AUDIO ENGINE ---
        const AudioEngine = {
            ctx: null,
            init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
            playShoot(type) {
                this.init(); if(this.ctx.state === 'suspended') this.ctx.resume();
                const now = this.ctx.currentTime;
                
                if (type === 'shotgun') {
                    // Heavy low-end scatter thump
                    const osc = this.ctx.createOscillator(); const osc2 = this.ctx.createOscillator();
                    const gain = this.ctx.createGain(); osc.connect(gain); osc2.connect(gain); gain.connect(this.ctx.destination);
                    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(95, now); osc.frequency.exponentialRampToValueAtTime(1, now + 0.3);
                    osc2.type = 'triangle'; osc2.frequency.setValueAtTime(140, now); osc2.frequency.exponentialRampToValueAtTime(1, now + 0.2);
                    gain.gain.setValueAtTime(0.7, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now); osc.stop(now + 0.3); osc2.start(now); osc2.stop(now + 0.2);
                } else if (type === 'sniper') {
                    // High power echoing explosion
                    const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
                    osc.connect(gain); gain.connect(this.ctx.destination);
                    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(440, now); osc.frequency.exponentialRampToValueAtTime(8, now + 0.55);
                    gain.gain.setValueAtTime(0.8, now); gain.gain.linearRampToValueAtTime(0.001, now + 0.55);
                    osc.start(now); osc.stop(now + 0.55);
                } else if (type === 'smg') {
                    // Snappy, high-pitched rapid metallic pop
                    const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
                    osc.connect(gain); gain.connect(this.ctx.destination);
                    osc.type = 'square'; osc.frequency.setValueAtTime(380, now); osc.frequency.exponentialRampToValueAtTime(60, now + 0.08);
                    gain.gain.setValueAtTime(0.25, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
                    osc.start(now); osc.stop(now + 0.08);
                } else if (type === 'pistol') {
                    // Crisp mid-range punchy crack
                    const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
                    osc.connect(gain); gain.connect(this.ctx.destination);
                    osc.type = 'square'; osc.frequency.setValueAtTime(220, now); osc.frequency.exponentialRampToValueAtTime(25, now + 0.14);
                    gain.gain.setValueAtTime(0.4, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.14);
                    osc.start(now); osc.stop(now + 0.14);
                } else { // Assault Rifle
                    // Heavy, punchy mid-bass mechanical clatter
                    const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
                    osc.connect(gain); gain.connect(this.ctx.destination);
                    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(190, now); osc.frequency.exponentialRampToValueAtTime(15, now + 0.18);
                    gain.gain.setValueAtTime(0.5, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.18);
                    osc.start(now); osc.stop(now + 0.18);
                }
            },
            playHit() {
                this.init(); const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
                osc.connect(gain); gain.connect(this.ctx.destination); osc.type = 'triangle';
                osc.frequency.setValueAtTime(90, now); osc.frequency.linearRampToValueAtTime(30, now + 0.1);
                gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            },
            playReload() {
                this.init(); const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
                osc.connect(gain); gain.connect(this.ctx.destination); osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now); osc.frequency.setValueAtTime(600, now + 0.15);
                gain.gain.setValueAtTime(0.08, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            }
        };

        // --- OPTIMIZED ENGINE SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050a18); 
        scene.fog = new THREE.FogExp2(0x050a18, 0.007); 

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 800);
        const renderer = new THREE.WebGLRenderer({ antialias: true, precision: "highp", powerPreference: "high-performance" });
        
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.1;
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap; 
        document.body.appendChild(renderer.domElement);

        const menus = { main: document.getElementById('menu-container'), wpn: document.getElementById('weapon-container'), set: document.getElementById('settings-container') };
        const fpsEl = document.getElementById('fps-counter');
        const blurToggle = document.getElementById('blur-toggle');
        const resToggle = document.getElementById('res-toggle');
        const fpsToggle = document.getElementById('fps-toggle');

        let playerHealth = 100, killCount = 0, currentWave = 1;
        const healthBarEl = document.getElementById('health-bar'), healthTextEl = document.getElementById('health-text'), damageFlashEl = document.getElementById('damage-flash'), killValEl = document.getElementById('kill-val'), waveBannerEl = document.getElementById('wave-banner');
        const clipValEl = document.getElementById('clip-val'), reserveValEl = document.getElementById('reserve-val'), weaponTagEl = document.getElementById('weapon-tag'), reloadPromptEl = document.getElementById('reload-prompt');

        // Weapon Profiler Setup
        const weaponStats = {
            rifle: { name: "Assault Rifle", clip: 30, maxClip: 30, reserve: 120, fireRate: 140, type: 'rifle' },
            shotgun: { name: "Tactical Shotgun", clip: 7, maxClip: 7, reserve: 28, fireRate: 750, type: 'shotgun' },
            sniper: { name: "Bolt-Action Sniper", clip: 5, maxClip: 5, reserve: 20, fireRate: 1200, type: 'sniper' },
            smg: { name: "Compact SMG", clip: 40, maxClip: 40, reserve: 160, fireRate: 75, type: 'smg' },
            pistol: { name: "Sidearm Pistol", clip: 12, maxClip: 12, reserve: 48, fireRate: 250, type: 'pistol' }
        };
        let activeWpnKey = 'rifle';
        let isReloading = false, lastFireTime = 0, isMouseDown = false;

        function updateHUD() {
            const w = weaponStats[activeWpnKey];
            weaponTagEl.innerText = w.name;
            clipValEl.innerText = w.clip;
            reserveValEl.innerText = w.reserve;
            reloadPromptEl.style.display = (w.clip === 0 && w.reserve > 0) ? 'block' : 'none';
        }

        function damagePlayer(amount) {
            playerHealth = Math.max(0, playerHealth - amount);
            healthBarEl.style.width = playerHealth + '%';
            healthTextEl.innerText = "HEALTH: " + Math.round(playerHealth) + "%";
            damageFlashEl.style.opacity = "1";
            setTimeout(() => damageFlashEl.style.opacity = "0", 150);
            if(playerHealth <= 0) { alert("SIMULATION TERMINATED.\nWAVE: " + currentWave + "\nTOTAL KILLS: " + killCount); location.reload(); }
        }

        function updateResolution() {
            const mode = resToggle.value;
            let targetWidth = window.innerWidth, targetHeight = window.innerHeight;
            if (mode !== 'native') {
                const targetLines = parseInt(mode);
                const currentAspect = window.innerWidth / window.innerHeight;
                targetHeight = targetLines; targetWidth = Math.round(targetLines * currentAspect);
            }
            renderer.setSize(targetWidth, targetHeight, false); 
            renderer.domElement.style.width = '100vw'; renderer.domElement.style.height = '100vh';
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
        }

        document.getElementById('open-settings').onclick = () => { menus.main.style.display = 'none'; menus.set.style.display = 'flex'; };

        let frames = 0, prevTime = performance.now();
        function updateFPS() {
            frames++; const time = performance.now();
            if (time >= prevTime + 1000) { fpsEl.innerText = "FPS: " + frames; frames = 0; prevTime = time; }
        }

        // --- LIGHTING ---
        const sun = new THREE.DirectionalLight(0xdbe9ff, 3.5);
        sun.position.set(80, 140, 60); sun.castShadow = true;
        sun.shadow.mapSize.width = 2048; sun.shadow.mapSize.height = 2048;
        const d = 130;
        sun.shadow.camera.left = -d; sun.shadow.camera.right = d; sun.shadow.camera.top = d; sun.shadow.camera.bottom = -d;
        scene.add(sun);
        scene.add(new THREE.AmbientLight(0x243860, 0.75));

        // --- GROUND ---
        const floorGeo = new THREE.PlaneGeometry(1600, 1600);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x0a140d, roughness: 0.95, metalness: 0.05 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

        // --- FOLIAGE ---
        const grassCount = 10000;
        const grassGeo = new THREE.PlaneGeometry(0.15, 0.85); grassGeo.translate(0, 0.42, 0); 
        const grassMat = new THREE.MeshStandardMaterial({ color: 0x3b8233, roughness: 0.8, side: THREE.DoubleSide });
        const instancedGrass = new THREE.InstancedMesh(grassGeo, grassMat, grassCount);
        const dummy = new THREE.Object3D();
        for (let i = 0; i < grassCount; i++) {
            dummy.position.set(Math.random() * 240 - 120, 0, Math.random() * 240 - 120);
            dummy.rotation.y = Math.random() * Math.PI;
            const scale = 0.85 + Math.random() * 0.4; dummy.scale.set(scale, scale, scale);
            dummy.updateMatrix(); instancedGrass.setMatrixAt(i, dummy.matrix);
        }
        scene.add(instancedGrass);

        const particles = [];
        const bloodGeo = new THREE.BoxGeometry(0.09, 0.09, 0.09);
        const bloodMat = new THREE.MeshStandardMaterial({ color: 0x900000, roughness: 0.4 });
        function spawnBlood(pos) {
            for(let i=0; i<8; i++) {
                const p = new THREE.Mesh(bloodGeo, bloodMat); p.position.copy(pos);
                const vel = new THREE.Vector3((Math.random()-0.5)*5, Math.random()*4 + 2, (Math.random()-0.5)*5);
                scene.add(p); particles.push({ mesh: p, vel: vel, life: 0.8 });
            }
        }

        // --- MUZZLE FLASH ENGINE ---
        const flashLight = new THREE.PointLight(0xffaa44, 0, 8);
        scene.add(flashLight);
        function triggerFlashVisuals() {
            flashLight.power = 35;
            const gunTip = new THREE.Vector3(0.3, -0.2, -1.2);
            gunTip.applyMatrix4(camera.matrixWorld);
            flashLight.position.copy(gunTip);
            setTimeout(() => { flashLight.power = 0; }, 45);
        }

        // --- VEHICLE ---
        class GolfCart {
            constructor() {
                this.group = new THREE.Group();
                const bodyMat = new THREE.MeshStandardMaterial({ color: 0xdcdcdc, roughness: 0.2, metalness: 0.7 }); 
                const metalMat = new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 0.9, roughness: 0.1 }); 
                const seatMat = new THREE.MeshStandardMaterial({ color: 0x15151c, roughness: 0.8 }); 
                const tireMat = new THREE.MeshStandardMaterial({ color: 0x09090b, roughness: 0.9 });
                const rimMat = new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 0.8, roughness: 0.2 });

                const base = new THREE.Mesh(new THREE.BoxGeometry(2, 0.2, 3.8), bodyMat); base.position.y = 0.4; base.castShadow = true;
                const fSeat = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.3, 0.9), seatMat); fSeat.position.set(0, 0.6, -0.1); fSeat.castShadow = true;
                const bSeat = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.3, 0.8), seatMat); bSeat.position.set(0, 0.6, -1.3); bSeat.castShadow = true;
                const dash = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.4, 0.4), bodyMat); dash.position.set(0, 1.0, 1.1); dash.castShadow = true;
                const roof = new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.1, 3.2), bodyMat); roof.position.set(0, 2.7, -0.2); roof.castShadow = true;
                this.group.add(base, fSeat, bSeat, dash, roof);

                [[-0.9, 1.2], [0.9, 1.2], [-0.9, -1.6], [0.9, -1.6]].forEach(p => {
                    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 2.3, 12), metalMat); pole.position.set(p[0], 1.55, p[1]); pole.castShadow = true;
                    this.group.add(pole);
                });

                const winFrame = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.8, 0.05), metalMat); winFrame.position.set(0, 1.4, 1.2); winFrame.castShadow = true;
                this.group.add(winFrame);

                this.wheels = []; this.frontWheelHubs = [];
                const wheelGeo = new THREE.CylinderGeometry(0.38, 0.38, 0.28, 24); 
                const rimGeo = new THREE.CylinderGeometry(0.22, 0.22, 0.29, 12);
                const wPos = [{x:-0.98, z:1.3, f:true}, {x:0.98, z:1.3, f:true}, {x:-0.98, z:-1.3, f:false}, {x:0.98, z:-1.3, f:false}];

                wPos.forEach(p => {
                    const wg = new THREE.Group();
                    const tire = new THREE.Mesh(wheelGeo, tireMat); tire.rotation.z = Math.PI/2; tire.castShadow = true;
                    const rim = new THREE.Mesh(rimGeo, rimMat); rim.rotation.z = Math.PI/2;
                    wg.add(tire, rim);
                    if(p.f) { const hub = new THREE.Group(); hub.position.set(p.x, 0.38, p.z); hub.add(wg); this.group.add(hub); this.frontWheelHubs.push(hub); } 
                    else { wg.position.set(p.x, 0.38, p.z); this.group.add(wg); }
                    this.wheels.push(wg);
                });

                this.steeringColumn = new THREE.Group(); this.steeringColumn.position.set(-0.5, 1.6, 0.7); this.steeringColumn.rotation.x = Math.PI / 12;
                const stand = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 1.4, 12), metalMat); stand.position.set(0, -0.6, 0.2); stand.rotation.x = -Math.PI / 8;
                this.steeringColumn.add(stand);

                this.wheelShaft = new THREE.Group();
                const wheel = new THREE.Mesh(new THREE.TorusGeometry(0.25, 0.025, 12, 24), seatMat);
                this.wheelShaft.add(wheel);

                const createHand = (isLeft) => {
                    const h = new THREE.Group(); const skin = new THREE.MeshStandardMaterial({ color: 0xdbac98, roughness: 0.8 });
                    const palm = new THREE.Mesh(new THREE.SphereGeometry(0.08, 8, 8), skin); palm.scale.set(1, 0.4, 1.2); h.add(palm);
                    const joints = []; [-0.04, 0, 0.04].forEach(x => {
                        const root = new THREE.Group(); root.position.set(isLeft ? x : -x, 0, 0.05);
                        const seg = new THREE.Mesh(new THREE.CapsuleGeometry(0.015, 0.05, 4, 8), skin); seg.rotation.x = 1.1;
                        const jnt = new THREE.Group(); jnt.add(seg); root.add(jnt); h.add(root); joints.push(jnt);
                    }); return { h, joints };
                };
                const L = createHand(true); const R = createHand(false);
                L.h.position.set(-0.2, 0, 0.05); R.h.position.set(0.2, 0, 0.05);
                this.handJoints = [...L.joints, ...R.joints];
                this.wheelShaft.add(L.h, R.h); this.steeringColumn.add(this.wheelShaft); this.group.add(this.steeringColumn);

                this.group.position.set(25, 0, 25); scene.add(this.group);
                this.speed = 0; this.steerAngle = 0;
            }
            update(move, delta) {
                if (move.w) this.speed = THREE.MathUtils.lerp(this.speed, 1.3, 0.05);
                else if (move.s) this.speed = THREE.MathUtils.lerp(this.speed, -0.5, 0.05);
                else this.speed *= 0.94;
                const targetSteer = move.a ? 0.85 : (move.d ? -0.85 : 0);
                this.steerAngle = THREE.MathUtils.lerp(this.steerAngle, targetSteer, 0.12);
                this.group.rotation.y += this.steerAngle * this.speed * 2.2 * delta;
                this.group.translateZ(this.speed * 24 * delta);
                this.wheels.forEach(w => w.rotation.x += this.speed * 55 * delta);
                this.frontWheelHubs.forEach(hub => hub.rotation.y = this.steerAngle * 0.6);
                this.wheelShaft.rotation.z = this.steerAngle * 2.5;
                this.handJoints.forEach(j => j.rotation.x = THREE.MathUtils.lerp(j.rotation.x, move.w ? 1.4 : 1.1, 0.1));
            }
        }
        const cart = new GolfCart();

        // --- ENEMIES SYSTEM ---
        class Enemy {
            constructor(position, speedMultiplier) {
                this.group = new THREE.Group();
                const skinCol = new THREE.Color().setHSL(0.02, 0.5, 0.12 + Math.random() * 0.1);
                const clothCol = new THREE.Color().setHSL(0.1 + Math.random() * 0.1, 0.4, 0.15);
                
                this.skinMat = new THREE.MeshStandardMaterial({ color: skinCol, roughness: 0.7 });
                this.clothMat = new THREE.MeshStandardMaterial({ color: clothCol, roughness: 0.85 });
                const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff1111 }); 
                
                this.torso = new THREE.Mesh(new THREE.BoxGeometry(0.75, 1.15, 0.5), this.clothMat); this.torso.position.y = 1.75; this.torso.castShadow = true;
                this.head = new THREE.Mesh(new THREE.BoxGeometry(0.48, 0.48, 0.48), this.skinMat); this.head.position.y = 2.6; this.head.castShadow = true;
                const jaw = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.12, 0.22), this.skinMat); jaw.position.set(0, -0.16, 0.1);
                const lEye = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.06, 0.12), eyeMat); lEye.position.set(-0.14, 0.06, 0.22);
                const rEye = lEye.clone(); rEye.position.set(0.14, 0.06, 0.22);
                this.head.add(jaw, lEye, rEye);
                
                this.lArm = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.95, 0.22), this.skinMat); this.lArm.position.set(-0.5, 2.15, 0.3); this.lArm.rotation.x = -1.3; this.lArm.castShadow = true;
                this.rArm = this.lArm.clone(); this.rArm.position.set(0.45, 2.15, 0.3);
                this.lLeg = new THREE.Mesh(new THREE.BoxGeometry(0.28, 1.25, 0.28), this.clothMat); this.lLeg.position.set(-0.24, 0.62, 0); this.lLeg.castShadow = true;
                this.rLeg = this.lLeg.clone(); this.rLeg.position.set(0.22, 0.62, 0);
                
                this.group.add(this.torso, this.head, this.lArm, this.rArm, this.lLeg, this.rLeg);
                this.group.position.copy(position);
                this.group.scale.setScalar(0.95 + Math.random() * 0.3);
                scene.add(this.group);
                
                this.isDead = false; this.deathTime = 0; this.speed = (4.0 + Math.random() * 2.5) * speedMultiplier;
                this.animOff = Math.random() * 6.28; this.physicsVel = new THREE.Vector3(); this.rotVel = new THREE.Vector3();
                this.attackCooldown = 0;
            }
            die(hitDirection, power) {
                if (this.isDead) return;
                this.isDead = true; killCount++; killValEl.innerText = killCount;
                AudioEngine.playHit();
                this.physicsVel.copy(hitDirection).multiplyScalar(power);
                this.rotVel.set(Math.random()-0.5, Math.random()-0.5, Math.random()-0.5).multiplyScalar(20);
                this.skinMat.color.setHex(0x1a0202); this.clothMat.color.setHex(0x0a0101);
                checkWaveStatus();
            }
            update(delta, playerPos) {
                if (!this.isDead) {
                    const dist = this.group.position.distanceTo(playerPos);
                    const dir = new THREE.Vector3().subVectors(playerPos, this.group.position); dir.y = 0; dir.normalize();
                    if (dist > 3.5) { this.group.position.addScaledVector(dir, this.speed * delta); } 
                    else { this.attackCooldown -= delta; if(this.attackCooldown <= 0) { damagePlayer(12); this.attackCooldown = 0.8; } }
                    this.group.lookAt(playerPos.x, 0, playerPos.z);
                    const t = (performance.now() * 0.006) + this.animOff;
                    this.lLeg.rotation.x = Math.sin(t) * 0.45; this.rLeg.rotation.x = Math.cos(t) * 0.45;
                    this.group.position.y = Math.abs(Math.sin(t * 2)) * 0.12;
                } else {
                    this.group.position.addScaledVector(this.physicsVel, delta);
                    this.group.rotation.x += this.rotVel.x * delta; this.group.rotation.y += this.rotVel.y * delta;
                    this.physicsVel.multiplyScalar(0.95);
                    if (this.group.position.y > 0.6) this.physicsVel.y -= 18 * delta;
                    else { this.group.position.y = 0.6; this.physicsVel.y *= -0.15; }
                    this.deathTime += delta;
                    if (this.deathTime > 1.2) { 
                        this.group.scale.multiplyScalar(0.92); 
                        if (this.group.scale.x <= 0.05) { 
                            this.group.traverse(c => { if (c.geometry) c.geometry.dispose(); if (c.material) c.material.dispose(); });
                            scene.remove(this.group); return true; 
                        } 
                    }
                }
                return false;
            }
        }

        let enemies = [];
        function spawnWave(waveNumber) {
            waveBannerEl.innerText = "WAVE " + waveNumber;
            const spawnCount = 8 + waveNumber * 4;
            const speedMultiplier = 1.0 + waveNumber * 0.08;
            for(let i=0; i<spawnCount; i++) {
                const angle = Math.random() * Math.PI * 2;
                const radius = 90 + Math.random() * 40;
                const pos = new THREE.Vector3(Math.cos(angle)*radius + camera.position.x, 0, Math.sin(angle)*radius + camera.position.z);
                enemies.push(new Enemy(pos, speedMultiplier));
            }
        }

        function checkWaveStatus() {
            const aliveEnemies = enemies.filter(e => !e.isDead);
            if (aliveEnemies.length === 0) {
                currentWave++;
                setTimeout(() => spawnWave(currentWave), 2000);
            }
        }

        // --- HIGH-DETAIL WEAPONS DESIGN ---
        const viewmodel = new THREE.Group();
        const matMatted = new THREE.MeshStandardMaterial({ color: 0x1c1d22, roughness: 0.5, metalness: 0.7 });
        const matSteel = new THREE.MeshStandardMaterial({ color: 0x4a4d53, roughness: 0.2, metalness: 0.95 });
        const matPoly = new THREE.MeshStandardMaterial({ color: 0x0f1012, roughness: 0.7, metalness: 0.2 });
        const matGold = new THREE.MeshStandardMaterial({ color: 0xcca344, roughness: 0.3, metalness: 0.9 });
        const matGlass = new THREE.MeshBasicMaterial({ color: 0x66ccff, opacity: 0.6, transparent: true });

        const buildRifle = () => {
            const g = new THREE.Group();
            const rec = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.12, 0.5), matMatted);
            const hand = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.09, 0.35), matPoly); hand.position.set(0, -0.01, -0.4);
            const stock = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.11, 0.28), matPoly); stock.position.set(0, 0.02, 0.38);
            const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.4, 8), matSteel); barrel.rotation.x = Math.PI/2; barrel.position.set(0, 0.02, -0.7);
            const mag = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.22, 0.12), matPoly); mag.position.set(0, -0.14, -0.15); mag.rotation.x = 0.2;
            g.add(rec, hand, stock, barrel, mag); return g;
        };

        const buildShotgun = () => {
            const g = new THREE.Group();
            const rec = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.13, 0.45), matSteel);
            const tube = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.022, 0.5, 8), matMatted); tube.rotation.x = Math.PI/2; tube.position.set(0, -0.02, -0.45);
            const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.52, 8), matSteel); barrel.rotation.x = Math.PI/2; barrel.position.set(0, 0.03, -0.46);
            const pump = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.08, 0.25), matPoly); pump.position.set(0, -0.03, -0.38);
            const stock = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.14, 0.32), matPoly); stock.position.set(0, -0.02, 0.35);
            g.add(rec, tube, barrel, pump, stock); return g;
        };

        const buildSniper = () => {
            const g = new THREE.Group();
            const frame = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.1, 0.7), matPoly);
            const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.016, 0.012, 0.8, 8), matSteel); barrel.rotation.x = Math.PI/2; barrel.position.set(0, 0.03, -0.75);
            const scopeTube = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.02, 0.3, 8), matMatted); scopeTube.rotation.x = Math.PI/2; scopeTube.position.set(0, 0.11, -0.05);
            frame.add(scopeTube); g.add(frame, barrel); return g;
        };

        const buildSMG = () => {
            const g = new THREE.Group();
            const rec = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.15, 0.38), matMatted);
            const mag = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.28, 0.06), matPoly); mag.position.set(0, -0.18, -0.08);
            const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.018, 0.18, 8), matSteel); barrel.rotation.x = Math.PI/2; barrel.position.set(0, 0.03, -0.28);
            g.add(rec, mag, barrel); return g;
        };

        const buildPistol = () => {
            const g = new THREE.Group();
            const slide = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.06, 0.24), matSteel); slide.position.y = 0.05;
            const frame = new THREE.Mesh(new THREE.BoxGeometry(0.046, 0.05, 0.22), matPoly); frame.position.set(0, 0.01, 0.01);
            const grip = new THREE.Mesh(new THREE.BoxGeometry(0.045, 0.13, 0.06), matPoly); grip.position.set(0, -0.07, 0.06); grip.rotation.x = 0.35;
            g.add(slide, frame, grip); return g;
        };

        const wpnObjects = {
            rifle: buildRifle(), shotgun: buildShotgun(), sniper: buildSniper(), smg: buildSMG(), pistol: buildPistol()
        };

        Object.values(wpnObjects).forEach(obj => { obj.visible = false; viewmodel.add(obj); });
        wpnObjects[activeWpnKey].visible = true;

        viewmodel.position.set(0.42, -0.38, -0.7);
        camera.add(viewmodel); scene.add(camera);

        const bullets = [];
        const bulletGeo = new THREE.CylinderGeometry(0.015, 0.015, 0.4, 6); bulletGeo.rotateX(Math.PI/2);
        const bulletMat = new THREE.MeshBasicMaterial({ color: 0xffcc44 });

        function fireWeapon() {
            if (isReloading) return;
            const now = performance.now();
            const stat = weaponStats[activeWpnKey];
            if (now - lastFireTime < stat.fireRate) return;
            if (stat.clip <= 0) { AudioEngine.playReload(); return; }

            stat.clip--;
            lastFireTime = now;
            updateHUD();
            AudioEngine.playShoot(stat.type);
            triggerFlashVisuals();

            let count = 1, spread = 0, curRecoil = 0.22;
            if (activeWpnKey === 'shotgun') { count = 10; spread = 0.12; }
            if (activeWpnKey === 'smg') { spread = 0.06; curRecoil = 0.09; }
            recoil = curRecoil;

            for(let i=0; i<count; i++) {
                const b = new THREE.Mesh(bulletGeo, bulletMat); viewmodel.getWorldPosition(b.position);
                const dir = new THREE.Vector3(); camera.getWorldDirection(dir);
                dir.x += (Math.random()-0.5)*spread; dir.y += (Math.random()-0.5)*spread; dir.normalize();
                b.lookAt(b.position.clone().add(dir)); scene.add(b); bullets.push({ mesh: b, dir: dir, time: 0 });
            }
        }

        function reloadWeapon() {
            const stat = weaponStats[activeWpnKey];
            if (isReloading || stat.clip === stat.maxClip || stat.reserve <= 0) return;
            isReloading = true;
            AudioEngine.playReload();
            
            setTimeout(() => {
                const needed = stat.maxClip - stat.clip;
                const transfer = Math.min(needed, stat.reserve);
                stat.clip += transfer; stat.reserve -= transfer;
                isReloading = false;
                updateHUD();
            }, 1200);
        }

        function switchWeapon(key) {
            if (isReloading || activeWpnKey === key) return;
            wpnObjects[activeWpnKey].visible = false;
            activeWpnKey = key;
            wpnObjects[activeWpnKey].visible = true;
            updateHUD();
        }

        const controls = new PointerLockControls(camera, document.body);
        document.getElementById('start-btn').onclick = () => { controls.lock(); AudioEngine.init(); };
        document.getElementById('open-weapons').onclick = () => { menus.main.style.display='none'; menus.wpn.style.display='flex'; };
        document.getElementById('back-from-weapons').onclick = () => { menus.wpn.style.display='none'; menus.main.style.display='flex'; };

        const setWpnViaMenu = (key) => { switchWeapon(key); menus.wpn.style.display='none'; controls.lock(); };
        document.getElementById('select-rifle').onclick = () => setWpnViaMenu('rifle');
        document.getElementById('select-shotgun').onclick = () => setWpnViaMenu('shotgun');
        document.getElementById('select-sniper').onclick = () => setWpnViaMenu('sniper');
        document.getElementById('select-smg').onclick = () => setWpnViaMenu('smg');
        document.getElementById('select-pistol').onclick = () => setWpnViaMenu('pistol');

        document.getElementById('back-to-menu').onclick = () => { menus.set.style.display = 'none'; menus.main.style.display = 'flex'; updateResolution(); };
        controls.addEventListener('lock', () => Object.values(menus).forEach(m => m.style.display = 'none'));
        controls.addEventListener('unlock', () => { menus.main.style.display = 'flex'; isMouseDown = false; });

        let move = { w: false, s: false, a: false, d: false }, velocity = new THREE.Vector3(), recoil = 0, isDriving = false;

        window.onmousedown = () => { if (controls.isLocked) isMouseDown = true; };
        window.onmouseup = () => { isMouseDown = false; };
        
        document.addEventListener('keydown', (e) => { 
            const k = e.key.toLowerCase(); if (move.hasOwnProperty(k)) move[k] = true;
            if (k === 'r') reloadWeapon();
            if (['1','2','3','4','5'].includes(e.key)) {
                const mapping = { '1': 'rifle', '2': 'shotgun', '3': 'sniper', '4': 'smg', '5': 'pistol' };
                switchWeapon(mapping[e.key]);
            }
            if (k === 'e' && controls.isLocked && camera.position.distanceTo(cart.group.position) < 7) { isDriving = !isDriving; viewmodel.visible = !isDriving; isMouseDown = false; }
        });
        document.addEventListener('keyup', (e) => { if (move.hasOwnProperty(e.key.toLowerCase())) move[e.key.toLowerCase()] = false; });

        // --- TICK ENGINE ---
        let lastTime = performance.now();
        let frameTicketAccumulator = 0;

        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now(); const delta = (time - lastTime) / 1000; lastTime = time;

            const fpsLimitMode = fpsToggle.value;
            if (fpsLimitMode !== 'unlocked') {
                const targetFps = parseInt(fpsLimitMode); const targetInterval = 1 / targetFps;
                frameTicketAccumulator += delta;
                if (frameTicketAccumulator < targetInterval) return; 
                frameTicketAccumulator %= targetInterval;
            }

            updateFPS();
            const executionDelta = Math.min(delta, 0.1);

            if (controls.isLocked) {
                // Continuous/Auto Firing Check
                if (isMouseDown && !isDriving) {
                    fireWeapon();
                }

                if (isDriving) {
                    cart.update(move, executionDelta);
                    const offset = new THREE.Vector3(-0.5, 2.2, 0.2).applyQuaternion(cart.group.quaternion);
                    camera.position.copy(cart.group.position).add(offset);
                    camera.lookAt(cart.group.position.clone().add(new THREE.Vector3(0, 1.4, 12).applyQuaternion(cart.group.quaternion)));
                    enemies.forEach(en => { if (!en.isDead && cart.group.position.distanceTo(en.group.position) < 3.8) en.die(new THREE.Vector3().subVectors(en.group.position, cart.group.position).normalize(), Math.abs(cart.speed) * 60); });
                } else {
                    velocity.x -= velocity.x * 10 * executionDelta; velocity.z -= velocity.z * 10 * executionDelta;
                    if (move.w) velocity.z -= 420 * executionDelta; if (move.s) velocity.z += 420 * executionDelta;
                    if (move.a) velocity.x -= 420 * executionDelta; if (move.d) velocity.x += 420 * executionDelta;
                    controls.moveRight(velocity.x * executionDelta); controls.moveForward(-velocity.z * executionDelta);
                    camera.position.y = 3.5;
                }

                for(let i = particles.length - 1; i >= 0; i--) {
                    particles[i].mesh.position.addScaledVector(particles[i].vel, executionDelta);
                    particles[i].vel.y -= 12 * executionDelta; particles[i].life -= executionDelta;
                    if(particles[i].life <= 0) { scene.remove(particles[i].mesh); particles.splice(i,1); }
                }

                for (let bi = bullets.length - 1; bi >= 0; bi--) {
                    const b = bullets[bi]; b.mesh.position.addScaledVector(b.dir, 240 * executionDelta); b.time += executionDelta;
                    let removed = false;
                    for (let i = enemies.length - 1; i >= 0; i--) {
                        if (!enemies[i].isDead && b.mesh.position.distanceTo(enemies[i].group.position.clone().add(new THREE.Vector3(0, 1.8, 0))) < 1.6) { 
                            spawnBlood(b.mesh.position); enemies[i].die(b.dir, 12); 
                            scene.remove(b.mesh); bullets.splice(bi, 1); removed = true; break; 
                        }
                    }
                    if (!removed && b.time > 1.8) { scene.remove(b.mesh); bullets.splice(bi, 1); }
                }

                for (let i = enemies.length - 1; i >= 0; i--) { if(enemies[i].update(executionDelta, camera.position)) enemies.splice(i, 1); }
                
                renderer.autoClearColor = (blurToggle.value !== "ON");
                recoil = THREE.MathUtils.lerp(recoil, 0, 0.12);
                if(isReloading) {
                    viewmodel.position.y = THREE.MathUtils.lerp(viewmodel.position.y, -0.9, 0.1);
                } else {
                    viewmodel.position.y = THREE.MathUtils.lerp(viewmodel.position.y, -0.38, 0.1);
                    viewmodel.position.z = -0.7 + recoil;
                }
            }
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', updateResolution);
        updateResolution();
        spawnWave(currentWave);
        updateHUD();
        animate();
    </script>
</body>
</html>
